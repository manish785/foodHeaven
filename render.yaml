# FoodHeaven — Render Blueprint
# Sync after push: Render Dashboard → Blueprint → Manual Sync
# https://dashboard.render.com/blueprints

databases:
  - name: foodheaven-db
    plan: free
    databaseName: foodheaven
    user: foodheaven

services:
  # Backend API (Node)
  - type: web
    name: foodheaven-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 120
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        value: https://foodheaven-five.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: foodheaven-db
          property: connectionString
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false

  # Frontend (static build — NOT parcel dev server)
  - type: web
    name: foodheaven-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://foodheaven-api.onrender.com/api/v1
      - key: REACT_APP_AUTH0_DOMAIN
        sync: false
      - key: REACT_APP_AUTH0_CLIENT_ID
        sync: false
      - key: REACT_APP_AUTH0_AUDIENCE
        sync: false
